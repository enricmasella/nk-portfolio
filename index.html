/* ───────── tokens: three tiers, exactly as the project has them. Tier 1 is the only place a literal appears ───────── */
:root {
  --raw-color-ice-50: #f7fafb;        /* frame fill */
  --raw-color-ice-100: #ebeef1;       /* backdrop contour lines */
  --raw-color-ice-200: #dfe5e9;       /* hairlines & dividers */
  --raw-color-steel-400: #b6c1c8;     /* muted copy on dark */
  --raw-color-ink-950: #090a0b;       /* all body copy */
  --raw-color-ink-900: #0e0f14;       /* "view project" panel fill */
  --raw-color-ink-800: #1b1d24;
  --raw-color-ink-700: #2a2d36;
  --raw-color-ink-alpha-35: rgb(9 10 11 / 0.35);
  --raw-color-slate-500: #7a7a7a;     /* season map: the halftone */
  --raw-color-slate-600: #4d4d4d;     /* season map: grid lines, inner ring */
  --raw-color-slate-900: #1e1e1e;     /* season map: the two outer rings */
  --raw-color-cyan-400: #02d2e3;      /* accent */
  --raw-color-cyan-alpha-25: rgb(2 210 227 / 0.25);
  --raw-color-stone-600: #535450;     /* timeline: plate outline */
  --raw-color-white-alpha-10: rgb(255 255 255 / 0.1);
  --raw-color-white-alpha-20: rgb(255 255 255 / 0.2);
  --raw-color-ink-alpha-08: rgb(9 10 11 / 0.08);
  --raw-color-white-alpha-40: rgb(255 255 255 / 0.4);
  --raw-color-white: #ffffff;
  --raw-color-orange-500: #ff6b00;    /* error/warning only — never on the page */

  --raw-font-size-96: 6rem;
  --raw-font-size-70: 4.375rem;
  --raw-font-size-52: 3.25rem;
  --raw-font-size-38: 2.375rem;
  --raw-font-size-20: 1.25rem;
  --raw-font-size-18: 1.125rem;
  --raw-font-size-16: 1rem;
  --raw-font-size-14: 0.875rem;
  --raw-font-size-12: 0.75rem;
  --raw-font-size-55: 3.4375rem;
  --raw-font-size-36: 2.25rem;

  --raw-leading-95: 0.95;
  --raw-leading-90: 0.9;
  --raw-leading-72: 0.72;
  --raw-leading-110: 1.1;
  --raw-tracking-stat: -0.08em;
  --raw-tracking-label: -0.04em;
  --raw-tracking-eyebrow: -0.02em;

  --raw-radius-16: 1rem; --raw-radius-48: 3rem; --raw-radius-100: 6.25rem;
  --raw-duration-fast: 150ms; --raw-duration-normal: 250ms; --raw-duration-slow: 700ms;
  --raw-edge-fade-share: 10%; --raw-edge-fade-length: 6rem;

  /* Tier 2 — roles */
  --background: var(--raw-color-ice-50);
  --foreground: var(--raw-color-ink-950);
  --foreground-muted: var(--raw-color-ink-alpha-35);
  --surface-dark: var(--raw-color-ink-900);
  --surface-dark-raised: var(--raw-color-ink-800);
  --surface-black: var(--raw-color-ink-950);
  --surface-muted: var(--raw-color-ice-100);
  --surface-soft: var(--raw-color-ice-200);
  --foreground-on-dark: var(--raw-color-white);
  --foreground-on-dark-muted: var(--raw-color-steel-400);
  --foreground-on-dark-faint: var(--raw-color-white-alpha-40);
  --border-muted: var(--raw-color-ice-200);
  --border-on-dark: var(--raw-color-ink-700);
  --map-dot: var(--raw-color-slate-500);
  --map-grid: var(--raw-color-slate-600);
  --map-grid-ghost: var(--raw-color-slate-900);
  --map-mark: var(--raw-color-ice-50);
  --timeline-outline: var(--raw-color-stone-600);
  --timeline-fill: var(--raw-color-white-alpha-10);
  --timeline-rail: var(--raw-color-white-alpha-20);
  --paddock-contour: var(--raw-color-ink-alpha-08);
  --footer-contour: var(--raw-color-white-alpha-10);
  --accent: var(--raw-color-cyan-400);
  --accent-muted: var(--raw-color-cyan-alpha-25);
  --type-impact: var(--raw-font-size-96); --type-display-lg: var(--raw-font-size-70);
  --type-display: var(--raw-font-size-52); --type-heading: var(--raw-font-size-38);
  --type-title: var(--raw-font-size-20); --type-lead: var(--raw-font-size-18);
  --type-label: var(--raw-font-size-16); --type-body: var(--raw-font-size-14);
  --type-eyebrow: var(--raw-font-size-12); --type-display-sm: var(--raw-font-size-55);
  --type-year: var(--raw-font-size-36);
  --leading-headline: 0.95; --leading-flat: 0.9; --leading-cap: 0.72; --leading-display: 1.1;
  --duration-fast: 150ms; --duration-normal: 250ms; --duration-plate: 700ms;
  --ease-entrance: cubic-bezier(0.2, 0, 0, 1);
  --ease-plate: cubic-bezier(0.33, 0, 0, 1);
  /* Emil Kowalski's strong curves for the few CSS transitions we do keep (hover, press) */
  --ease-out-strong: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out-strong: cubic-bezier(0.77, 0, 0.175, 1);
  --font-sans: "Space Grotesk", system-ui, sans-serif;
  --font-display: "Oswald", Impact, sans-serif;
}

/* ───────── the root font-size bands: below 1280 the root holds at 16px ───────── */
html { font-size: 16px; }
@media (max-width: 1920px) { html { font-size: 0.833333vw; } }  /* 16·100/1920 */
@media (max-width: 1440px) { html { font-size: 1.111111vw; } }  /* 16·100/1440 */
@media (max-width: 1279px) { html { font-size: 16px; } }
/* above 1920 main.js writes 16 * innerWidth / 1920 px onto <html> */

/* The 1441–1920 band is based on 1920 but the blocks were drawn at 1440 → type is multiplied back by 1920/1440 */
@media (min-width: 1441px) and (max-width: 1920px) {
  [data-hero] { --hero-base: calc(1920 / 1440);
    --type-impact: calc(6rem * var(--hero-base)); --type-display-lg: calc(4.375rem * var(--hero-base));
    --type-display: calc(3.25rem * var(--hero-base)); --type-heading: calc(2.375rem * var(--hero-base));
    --type-title: calc(1.25rem * var(--hero-base)); --type-lead: calc(1.125rem * var(--hero-base));
    --type-label: calc(1rem * var(--hero-base)); --type-body: calc(0.875rem * var(--hero-base));
    --type-eyebrow: calc(0.75rem * var(--hero-base)); }
  [data-hero] [data-hero-panels] { width: calc(13.625rem * var(--hero-base, 1)); }
  [data-hero] [data-hero-stats]  { width: calc(10.75rem * var(--hero-base, 1)); }
  [data-hero] [data-hero-map]    { height: calc(3.125rem * var(--hero-base, 1)); width: calc(4.875rem * var(--hero-base, 1)); }
  [data-season] { --season-base: calc(1920 / 1440);
    --type-display-sm: calc(3.4375rem * var(--season-base)); --type-lead: calc(1.125rem * var(--season-base));
    --type-body: calc(0.875rem * var(--season-base)); --type-eyebrow: calc(0.75rem * var(--season-base)); }
}

/* ───────── document ───────── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--background); }
body { margin: 0; min-height: 100lvh; background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow-x: clip; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
img, svg, canvas { display: block; }
[hidden] { display: none !important; }
::selection { background: var(--accent); color: var(--surface-black); }

.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.skip { position: fixed; left: 1rem; top: -4rem; z-index: 200; padding: 0.75rem 1rem; background: var(--surface-black); color: var(--accent); font-size: 14px; text-transform: uppercase; transition: top 150ms var(--ease-out-strong); }
.skip:focus-visible { top: 1rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Lenis */
html.lenis, html.lenis body { height: auto; }
.lenis:not(.lenis-autoToggle).lenis-stopped { overflow: clip; }
.lenis [data-lenis-prevent] { overscroll-behavior: contain; }
html.scroll-locked { position: relative; overflow: hidden; height: 100%; }

/* dev banner (visible only on localhost / file: / ?dev) */
#devbanner { position: fixed; left: 0; right: 0; bottom: 0; z-index: 300; background: var(--raw-color-orange-500); color: #000; font: 12px/1.4 var(--font-sans); padding: 6px 12px; }

/* ───────── the sticky stack ───────── */
[data-stack] { position: relative; background: var(--surface-black); }
.layer { position: sticky; top: 0; z-index: 0; }
.layer--2 { z-index: 10; }
.layer--3 { position: relative; z-index: 20; }
.layer > .inner { position: relative; transform-origin: center; }
.layer > .shade { position: absolute; inset: 0; background: var(--surface-black); opacity: 0; pointer-events: none; }

/* ───────── shared UI: chamfered CTA (hero + inside the work) ───────── */
.cta {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 1.6em;
  height: 2.5em; width: 11em; font-size: var(--type-title); color: var(--accent);
  text-transform: uppercase; line-height: 0.9; white-space: nowrap;
  transition: transform 160ms var(--ease-out-strong);
}
.cta:active { transform: scale(0.97); }
.cta__frame { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.cta__flood { transform-origin: left; transform: scaleX(0); transition: transform var(--duration-normal) var(--ease-plate); }
.cta__label { position: relative; transition: color var(--duration-normal) var(--ease-plate); }
.cta__arrow { position: relative; width: 0.65em; height: 0.5em; transition: transform var(--duration-fast) var(--ease-entrance); }
.cta__arrow path { stroke: var(--accent); transition: stroke var(--duration-normal) var(--ease-plate); }
@media (hover: hover) and (pointer: fine) {
  .cta:hover .cta__flood { transform: scaleX(1); }
  .cta:hover .cta__label { color: var(--surface-black); }
  .cta:hover .cta__arrow { transform: translateX(0.25rem); }
  .cta:hover .cta__arrow path { stroke: var(--surface-black); }
}

/* the chequered seam (dissolve.js): a canvas band across the top of a block */
.dissolve { position: absolute; left: 0; right: 0; top: 0; height: 34svh; pointer-events: none; z-index: var(--dz, 10); }
.dissolve > canvas { width: 100%; height: 100%; }
@media (max-width: 639px) { .dissolve { z-index: 0; } }

/* bracket panel (four 10×10 corner strokes) */
.bracket { position: relative; padding: 1rem; }
.bracket > .bk { position: absolute; width: 0.625rem; height: 0.625rem; color: var(--foreground); }
.bracket > .bk--tr { top: 0; right: 0; }
.bracket > .bk--tl { top: 0; left: 0; transform: scaleX(-1); }
.bracket > .bk--bl { bottom: 0; left: 0; transform: scale(-1); }
.bracket > .bk--br { bottom: 0; right: 0; transform: scaleY(-1); }
.bracket > .bk path { stroke: currentColor; fill: none; }

/* hover colour links: accent on hover, 150ms */
.link-accent { transition: color var(--duration-fast) var(--ease-entrance); }
@media (hover: hover) and (pointer: fine) { .link-accent:hover { color: var(--accent); } }

@media (prefers-reduced-motion: reduce) {
  .cta, .cta__flood, .cta__label, .cta__arrow, .link-accent { transition-duration: 0.01ms; }
}


/* ═══════════ 1 — the hero ═══════════
   Measured in rem: the root scales with the viewport above 1280 (base.css), so a rem is one design pixel of the 1440 frame. */
[data-hero] { position: relative; isolation: isolate; min-height: 100lvh; overflow: hidden; background: var(--background); color: var(--foreground); }

/* ── the scene: full-bleed at every width ── */
.hero__scene { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.hero__canvas { position: absolute; inset: 0; width: 100%; height: 100%; transform: translateZ(0); backface-visibility: hidden; will-change: transform; }
.hero__fallback { position: absolute; left: 50%; bottom: -1.2%; height: 86%; width: auto; aspect-ratio: 1.5; transform: translateX(-50%); object-fit: contain; }

/* ── the photo: the layout owns where it stands. This is only a slot — the scene reads its box and draws the photo to fit it
   (largest 3:4 rectangle that fits, standing on the bottom edge). Unused while the hero shows the model. ── */
.hero__plate { display: none; position: absolute; }
[data-subject="photo"] .hero__plate { display: block; left: calc(50% - 17rem); width: 36rem; top: 8.25rem; bottom: 0; }
[data-subject="photo"] .hero__plate .hero__fallback { position: static; transform: none; width: 100%; height: 100%; aspect-ratio: auto; object-fit: contain; object-position: center bottom; }
[data-subject="photo"] .hero__ramp, [data-subject="photo"] .hero__ramp2 { display: none; }
@media (max-width: 1279px) { [data-subject="photo"] .hero__plate { left: 0; right: 0; width: auto; top: 36%; } }
/* portrait tablets: below the panels, and above the actions row (its mail link and socials would run under a photo this wide) */
@media (max-width: 1023px) { [data-subject="photo"] .hero__plate { top: 43%; bottom: 5.5rem; } }
/* phones: the full-width button stands on the photo, so it runs to the bottom edge */
@media (max-width: 639px) { [data-subject="photo"] .hero__plate { top: 46%; bottom: 0; } }
/* phones on their side: the photo takes the free middle column, between the masthead and the button */
@media (max-height: 500px) and (max-width: 1023px) { [data-subject="photo"] .hero__plate { top: 4.25rem; bottom: 4.75rem; } }

/* the ramp: below xl the figure fades into the page so the copy underneath stays legible */
.hero__ramp { display: none; position: absolute; left: 0; right: 0; bottom: 0; height: 22%; z-index: 10; pointer-events: none;
  background-image: linear-gradient(to bottom,
    color-mix(in srgb, var(--background) 0%, transparent) 0%,
    color-mix(in srgb, var(--background) 6%, transparent) 26%,
    color-mix(in srgb, var(--background) 20%, transparent) 46%,
    color-mix(in srgb, var(--background) 45%, transparent) 64%,
    color-mix(in srgb, var(--background) 74%, transparent) 80%,
    color-mix(in srgb, var(--background) 93%, transparent) 91%,
    var(--background) 100%); }
@media (max-width: 1279px) { .hero__ramp { display: block; } }

/* ── the content column ── */
.hero__col { position: relative; z-index: 20; min-height: 100lvh; display: flex; flex-direction: column; gap: 1.5rem; padding: 1.5rem; }
@media (min-width: 640px) { .hero__col { padding-inline: 2rem; } }
@media (max-width: 1023px) { .hero__col { gap: 1rem; } }
@media (max-width: 639px) { .hero__col { gap: 0.5rem; } }
@media (max-height: 500px) { .hero__col { gap: 1rem; padding-block: 0.75rem; } }

/* ── the masthead ── */
.mast { position: relative; z-index: 30; display: flex; align-items: center; justify-content: space-between; }
.mast__logo { display: inline-flex; align-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; line-height: 1; letter-spacing: 0.01em; text-transform: uppercase; }
.mast__nav { display: none; }
.mast__nav a, .mast__github { font-size: var(--type-label); text-transform: uppercase; line-height: 0.9; color: var(--foreground); }
.mast__github { display: none; font-weight: 700; white-space: nowrap; }
.mast__right { display: flex; align-items: center; gap: 1.25rem; }
@media (min-width: 1280px) {
  .mast__nav { display: block; position: absolute; left: 50%; transform: translateX(-50%); }
  .mast__nav ul { display: flex; gap: 4rem; }
  .mast__github { display: inline-block; }
  .burger { display: none; }
}

/* language switch */
.lang { display: inline-flex; align-items: center; }
.lang button { min-height: 2.25rem; padding: 0.5rem 0.4rem; font-size: var(--type-eyebrow); font-weight: 500; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase;
  color: color-mix(in srgb, var(--foreground) 55%, transparent); transition: color var(--duration-fast) var(--ease-entrance), transform 160ms var(--ease-out-strong); }
.lang button[aria-pressed="true"] { color: var(--foreground); box-shadow: inset 0 -1px 0 currentColor; }
.lang button:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { .lang button:hover { color: var(--accent); } }
@media (pointer: coarse) { .lang button { min-width: 2.75rem; min-height: 2.75rem; font-size: 0.8125rem; } }

/* burger */
.burger { display: inline-flex; flex-direction: column; justify-content: center; gap: 0.3125rem; padding: 0.75rem; margin-right: -0.75rem; transition: transform 160ms var(--ease-out-strong); }
.burger:active { transform: scale(0.97); }
.burger span { display: block; width: 1.5rem; height: 1px; background: var(--foreground); }
@media (min-width: 1280px) { .burger { display: none; } }

/* ── the fit box: below xl the figure is fitted to a box the layout owns (read by applyFit) ── */
.hero__fitwrap { position: absolute; inset: 0; margin: 0 -1.5rem; z-index: 0; pointer-events: none; }
.hero__fit { position: absolute; left: 0; right: 0; bottom: 0; height: calc(100% - 2rem); }
.hero__ramp2 { display: none; position: absolute; left: 0; right: 0; bottom: -13rem; height: 26rem; background: linear-gradient(to bottom, transparent, var(--background) 60%, var(--background)); }
@media (min-width: 1280px) { .hero__fitwrap { display: none; } }
@media (max-width: 1023px) { .hero__fitwrap { top: 30%; } .hero__fit { height: 100%; } }
@media (max-width: 767px) { .hero__ramp2 { display: block; } }
@media (max-width: 639px) { .hero__fitwrap { top: 36%; } }

/* ── identity + panels ── */
.hero__main { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: flex-start; }
@media (min-width: 768px) { .hero__main { flex-direction: row; justify-content: space-between; gap: 2rem; } }
@media (min-width: 1280px) { .hero__main { align-items: center; gap: 0; } }

.ident { position: relative; display: flex; flex-direction: column; gap: 1.5rem; max-width: 26.0625rem; }
@media (min-width: 1280px) { .ident { gap: 6.0625rem; } }
.ident__id { margin-bottom: -0.5rem; font-size: var(--type-label); text-transform: uppercase; line-height: 0.9; color: var(--foreground-muted); }
.ident__name { max-width: 6em; text-align: left; font-family: var(--font-display); font-weight: 700; font-size: var(--type-display-lg); line-height: var(--leading-headline); text-transform: uppercase; }
@media (min-width: 768px) { .ident__name { font-size: var(--type-impact); } }
@media (min-width: 1024px) { .ident__name { font-size: var(--type-display-lg); } }
@media (min-width: 1280px) {
  .ident__name { font-size: var(--type-impact); }
  .ident__id { position: absolute; left: 20.0625rem; top: 0.5625rem; margin: 0; }
  [data-subject="photo"] .ident__id { left: 17.5rem; }
}
@media (max-height: 500px) { .ident { gap: 0.5rem; } .ident__name { font-size: var(--type-heading); } .ident__id { margin-bottom: -0.25rem; } }

.ident__meta { display: flex; flex-direction: column; gap: 1rem; }
.ident__meta li { display: flex; align-items: center; gap: 0.5rem; font-size: var(--type-lead); text-transform: uppercase; line-height: 0.9; }
@media (max-height: 500px) { .ident__meta { gap: 0.25rem; } }
.ico { flex: none; color: var(--foreground); }
.ico--loc { width: 1.125rem; height: 0.75rem; overflow: visible; }
.ico--learn { width: 1rem; height: 1rem; }
.ico--seek { width: 0.875rem; height: 0.875rem; }

.panels { display: none; }
@media (min-width: 640px) { .panels { display: flex; flex-wrap: wrap; gap: 2rem; align-self: stretch; } }
@media (min-width: 768px) { .panels { flex-direction: column; flex-wrap: nowrap; width: 13.625rem; align-self: auto; } }
@media (min-width: 1280px) { .panels { flex: none; } }

.panel { padding: 1rem; }
@media (min-width: 640px) { .panel { padding: 1rem 1.375rem 1.1875rem; } }
.eyebrow { font-size: var(--type-eyebrow); font-weight: 500; text-transform: uppercase; line-height: 0.9; letter-spacing: var(--raw-tracking-eyebrow); }
.eyebrow--accent { color: var(--accent); }
.panel__row { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-top: 1rem; }
@media (min-width: 768px) { .panel__row { flex-direction: column; justify-content: flex-start; gap: 1.75rem; } }
.panel__list { display: flex; flex-direction: column; gap: 0.375rem; font-size: var(--type-body); text-transform: uppercase; line-height: 0.9; }
.panel__list dt { font-weight: 700; }
.panel__map { flex: none; width: 4.875rem; height: 3.125rem; color: var(--foreground); overflow: visible; }

.stats { display: flex; justify-content: space-between; width: 10.75rem; margin-top: 1.5rem; }
.stats__cell { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; text-align: center; }
.stats dt { font-size: var(--type-eyebrow); text-transform: uppercase; letter-spacing: var(--raw-tracking-label); line-height: 0.9; white-space: nowrap; }
.stats dd { font-family: var(--font-display); font-weight: 500; font-size: var(--type-heading); line-height: var(--leading-cap); letter-spacing: var(--raw-tracking-stat); }
@media (max-height: 500px) { .panels { gap: 0.5rem; } .panel { padding: 0.5rem 0.875rem; } .panel__row { margin-top: 0.5rem; } .panel__map { display: none; } .stats { margin-top: 0.75rem; } }

/* ── the actions row ── */
.actions { position: relative; z-index: 1; margin-top: 0.5rem; display: flex; flex-direction: column; gap: 1rem; }
@media (min-width: 640px) { .actions { margin-top: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 2rem; } }
.live { display: none; align-items: center; gap: 0.75rem; justify-self: start; }
@media (min-width: 640px) { .live { display: inline-flex; } }
.live__ico { flex: none; width: 2rem; height: 2rem; }
.live__text { display: flex; flex-direction: column; gap: 0.375rem; font-size: var(--type-body); text-transform: uppercase; line-height: 0.9; }
.live__label { font-weight: 500; }
.live__host { color: var(--foreground-muted); }
.actions__cta { display: flex; justify-content: center; }
.actions__cta .cta { width: 100%; height: 3.5rem; }
@media (min-width: 640px) { .actions__cta .cta { width: auto; min-width: 11em; height: 2.5em; padding-inline: 1.5em; } }
.socials { display: none; justify-self: end; gap: 2rem; font-size: var(--type-body); text-transform: uppercase; line-height: 0.9; }
@media (min-width: 640px) { .socials { display: flex; } }
@media (min-width: 1280px) { .socials { gap: 3.6875rem; } }

/* ── the loading veil ── */
.veil { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--background); pointer-events: auto; }
.veil__content { display: flex; flex-direction: column; align-items: center; }
.veil__mark { position: relative; width: 7.2rem; height: 8.5rem; -webkit-mask: var(--veil-mask) center / contain no-repeat; mask: var(--veil-mask) center / contain no-repeat; }
.veil__shell, .veil__fill { position: absolute; inset: 0; background: var(--foreground); }
.veil__shell { opacity: 0.12; }
.veil__fill { transform-origin: top; transform: scaleY(0); }
.veil__name { margin-top: 1.75rem; font-size: var(--type-lead); text-transform: uppercase; line-height: 0.9; letter-spacing: 0.18em; }
.veil__meter { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--border-muted); }
.veil__bar { display: block; height: 100%; background: var(--foreground); transform-origin: left; transform: scaleX(0); }

/* ── the full-screen sheet (below xl); lives on <body>, never inside the transformed masthead ── */
.sheet { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; padding: 1.5rem 2rem; background: var(--background); color: var(--foreground); }
.sheet__top { display: flex; align-items: center; justify-content: space-between; }
.sheet__close { position: relative; width: 3rem; height: 3rem; margin-right: -0.75rem; transition: transform 160ms var(--ease-out-strong); }
.sheet__close:active { transform: scale(0.97); }
.sheet__close span { position: absolute; left: 0.75rem; right: 0.75rem; top: 50%; height: 1px; background: var(--foreground); }
.sheet__close span:first-child { transform: rotate(45deg); }
.sheet__close span:last-child { transform: rotate(-45deg); }
.sheet__nav { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 1rem; }
@media (min-width: 640px) { .sheet__nav { gap: 1.5rem; } }
.sheet__nav a { display: inline-block; padding-block: 0.125rem; font-family: var(--font-display); font-weight: 700; font-size: var(--type-heading); line-height: 0.95; text-transform: uppercase; }
@media (min-width: 640px) { .sheet__nav a { font-size: var(--type-display); } }
.sheet__foot { display: flex; align-items: center; justify-content: space-between; }

@media (prefers-reduced-motion: reduce) { .lang button, .burger, .sheet__close { transition-duration: 0.01ms; } }


/* season — "Selected work". A black stage with a circuit map and a dotted field, a copy column laid over it, and a
   standings plate bottom right. One design px is calc(100cqw / 1440) off this section's own width. */
[data-season] {
  --u: calc(100cqw / 1440);
  --season-gutter: max(2.2222cqw, var(--gutter-min, 0px));
  container-type: inline-size;
  position: relative;
  isolation: isolate;
  overflow: hidden;
  width: 100%;
  min-height: var(--season-h, 100lvh);
  background: var(--surface-black);
  color: var(--foreground-on-dark);
}
@media (max-width: 1023px) {
  [data-season] {
    --gutter-min: 32px; --type-min: 13px; --copy-min-size: 17px; --copy-min-w: 15rem; --head-min: 6.6667cqw;
    --plate-w: 277px; --plate-h: 78px; --plate-cell: 83px; --plate-badge-gap: 11px; --plate-globe-w: 37px; --plate-globe-h: 23px;
    --plate-stats-left: 16px; --plate-stats-gap: 8px; --plate-eyebrow: 12px; --plate-body: 14px;
  }
}
@media (max-width: 639px) { [data-season] { --head-min: 40px; --head-air: 20px; --season-h: 680px; } }

/* ───────── the stage ───────── */
.ss__frame { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
@media (min-width: 1024px) {
  .ss__frame { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 10%, #000 90%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 10%, #000 90%, transparent 100%); }
}
.ss__world { position: absolute; left: 0; top: 0; width: 1440px; height: 800px; transform-origin: 0 0; }
.ss__dots, .ss__grid, .ss__track { position: absolute; left: 0; top: var(--map-top, -4.557px); width: var(--map-w, 1438.43px); height: var(--map-h, 809.11px); overflow: visible; }
.ss__lap { position: absolute; left: 0; top: 0; width: 1440px; height: 800px; }

.ss__lines line { stroke: var(--map-grid); stroke-width: 2.13; stroke-dasharray: 12.15 8.35; }
.ss__ring { fill: none; }
.ss__ring--inner { stroke: var(--map-grid); stroke-width: 3.04; }
.ss__ring--ghost { stroke: var(--map-grid-ghost); stroke-width: 2.13; }
.ss__ping { fill: none; stroke: var(--accent); stroke-width: 2.13; }
.ss__hub { fill: var(--accent); }
.ss__marks path { fill: none; stroke: var(--map-mark); stroke-width: 2.13; }

.ss__ribbon { fill: var(--foreground-on-dark); fill-rule: evenodd; }
.ss__ribbon--lit { fill: var(--accent); }
.ss__turns polygon { fill: var(--accent); opacity: 0; }
.ss__flag { fill: var(--map-mark); }

/* ───────── the copy column ───────── */
.ss__copy {
  position: relative; z-index: 20;
  min-height: var(--season-h, 100lvh);
  display: flex; flex-direction: column; justify-content: space-between; gap: 4rem;
  padding: 4.8611cqw 1.5rem 2rem;
  pointer-events: none;
}
.ss__copy a, .ss__copy .ss__plate { pointer-events: auto; }
@media (min-width: 640px) { .ss__copy { padding: 4.8611cqw var(--season-gutter) var(--season-gutter); } }

.ss__head { margin: 0; display: flex; flex-direction: column; align-items: flex-start; width: max-content; max-width: 100%;
  font: 700 max(3.8194cqw, var(--head-min, 0px)) / var(--leading-headline) var(--font-display); text-transform: uppercase; color: var(--accent); }
.ss__line { display: flex; align-items: baseline; white-space: nowrap; }
.ss__stop { color: var(--foreground-on-dark); }
.ss__rule { display: block; width: max(1.6667cqw, 24px); height: max(0.1389cqw, 2px); margin-top: max(1.9444cqw, var(--head-air, 0px)); background: var(--accent); transform-origin: 0 50%; }
.ss__intro { margin: max(2.0833cqw, var(--head-air, 0px)) 0 0; width: max(16.1111cqw, var(--copy-min-w, 0px)); font-size: max(1.25cqw, var(--copy-min-size, 0px)); line-height: 1.1; text-transform: uppercase; color: var(--foreground-on-dark); }

/* the projects index, bottom left, level with the plate */
.ss__foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 2rem 3rem; flex-wrap: wrap; }
.ss__index { list-style: none; margin: 0; padding: 0; min-width: max(17cqw, 15rem);
  font: 500 max(0.9722cqw, var(--type-min, 0px)) / 1.25 var(--font-sans); text-transform: uppercase; letter-spacing: 0.04em; }
.ss__item { display: flex; align-items: baseline; gap: 0.7em; padding: 0.7em 0; border-top: 1px solid var(--map-grid); color: var(--foreground-on-dark-muted); }
.ss__item:last-child { border-bottom: 1px solid var(--map-grid); }
.ss__item--live { color: var(--foreground-on-dark); }

/* paddock — "Inside the work". The 1440×800 frame at 1:1 in cqw: --u is one design px. */
[data-paddock] {

  --gutter: 2.2222cqw;
  --band-h: calc(11.7361cqw * var(--band-scale, 1));

  position: relative;
  isolation: isolate;
  overflow: hidden;
  width: 100%;
  min-height: var(--block-h, max(100lvh, 55.5556cqw));   /* never shorter than the 1440×800 frame the layout is drawn on */
  background: var(--background);
  color: var(--foreground);
}

    --stats-rule-top: 16px; --stats-rule-bottom: 11px; --stats-frame-drop: 0px; --stats-drop: 2.86cqw; --stats-col-w: 170px; --intro-min-w: 280px;

var CAP_60 = 1e3 / 60 - 2;
var isEnergySaver = () => {
  const nav = navigator;
  return Boolean(nav.connection?.saveData) || (nav.deviceMemory ?? 8) <= 2;
};
var getSceneTier = () => {
  const coarse = window.matchMedia("(hover: none) and (pointer: coarse)").matches;
  const width = window.innerWidth;
  const name = width < 768 || coarse && width < 1024 ? "mobile" : coarse || width < 1280 ? "tablet" : "desktop";
  const mobile = name === "mobile";
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const saver = isEnergySaver();
  return {
    name,
    mobile,
    coarsePointer: coarse,
    reducedMotion,
    // 1 → 1.25 → 1.5. Held at 1 on a phone rather than the skill's 0.85: this
    // scene draws hairline backdrop contours, and sub-1.0 aliases them
    // visibly (§6's hard-edged-geometry exception). Not above 1.5 anywhere —
    // a 3× phone at its native ratio would draw nine times the fragments of
    // this for no difference a reader can see.
    maxDpr: mobile ? 1 : name === "tablet" ? 1.25 : 1.5,
    // Touch tiers cap at 60, desktop runs every tick. This was 1000/30 on a
    // phone (26fps as the ticker measures it) and 1000/45 on a tablet, on the
    // skill's argument that a slowly evolving field cannot show a halved
    // frame rate — but nothing in this scene evolves slowly. The idle sweep
    // is a 0.45s stroke, the entrance is a burn, and the figure tilts with
    // the pointer; at 26fps every one of them stepped, and it was reported
    // as lag from a device emulator on a desktop GPU, where fill cannot have
    // been the cost. The frame is paid for elsewhere: the backdrop's reveal
    // loop no longer runs where it is invisible, and the wireframe is off.
    frameInterval: name === "desktop" ? 0 : CAP_60,
    pointerEnabled: !coarse && !reducedMotion,
    antialias: name === "desktop",
    trailSamples: mobile ? 28 : name === "tablet" ? 44 : 72,
    outline: !mobile,
    reveal: !mobile,
    freeze: reducedMotion || mobile && saver
  };
};
